services:
  gateway:
    build: ./gateway
    volumes:
      - sock:/tmp
      - ./config:/config
    expose:
      - "8443"
    restart: unless-stopped

  reality:
    build: ./reality
    ports:
      - "443:443"
    volumes:
      - sock:/tmp
      - ./config:/config
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  sock:
